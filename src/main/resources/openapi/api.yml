openapi: 3.0.3
info:
  title: Teraha Commons Data Models
  version: 2.1.2
  description: DTOs para el modulo commons

paths: {}

components:
  schemas:

    # --- BASE ENTITY DTO ---
    BaseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1

    # --- PERSONA Y CLIENTE ---
    PersonDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            name:
              type: string
              example: "Juan Pérez"
            document:
              type: string
              example: "1234567-8"
            address:
              type: string
              example: "Av. Principal 123"
            email:
              type: string
              format: email
              example: "juan.perez@email.com"
            phone:
              type: string
              example: "+595981123456"
            active:
              type: boolean
              example: true

    ClientDTO:
      allOf:
        - $ref: '#/components/schemas/PersonDTO'
        - type: object
          properties:
            birthDate:
              type: string
              format: date
              example: "1995-05-20"

    SupplierDTO:
      allOf:
        - $ref: '#/components/schemas/PersonDTO'
        - type: object
          properties:
            timbrado:
              type: string
              example: "1100437-1"

    # --- CATEGORIA Y PRODUCTO ---
    CategoryDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            name:
              type: string
              example: "Electrónica"

    ProductDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            code:
              type: string
              example: "PROD-001"
            description:
              type: string
              example: "Teclado Mecánico RGB"
            stock:
              type: integer
              example: 50
            price:
              type: number
              format: double
              example: 150.00
            cost:
              type: number
              format: double
              example: 100.00
            margin:
              type: number
              format: double
              example: 50.00
            active:
              type: boolean
              example: true
            categoryIds:
              type: array
              items:
                type: integer
                format: int64
              example: [1, 2]
            supplierIds:
              type: array
              items:
                type: integer
                format: int64
              example: [1, 2]

    # --- REPORTES PRODUCTO ---
    ProductMonthlyReportDTO:
      type: object
      required:
        - productId
        - code
        - description
        - price
        - totalSold
        - totalRevenue
        - topBuyerName
        - topBuyerQuantity
      properties:
        productId:
          type: integer
          format: int64
          example: 12
        code:
          type: string
          example: "PROD-001"
        description:
          type: string
          example: "Teclado Mecánico RGB"
        price:
          type: number
          example: 150.00
          description: Current product price
        totalSold:
          type: integer
          format: int64
          example: 42
          description: Total units sold during the reporting month
        totalRevenue:
          type: number
          example: 6300.00
          description: Revenue calculated using historical sale detail prices
        topBuyerName:
          type: string
          example: "Juan Pérez"
        topBuyerQuantity:
          type: integer
          format: int64
          example: 15
          description: Units purchased by the product's biggest buyer

    # --- FACTURAS BASE Y DETALLES BASE ---
    InvoiceDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            cancelled:
              type: boolean
              example: false
              description: "Wheter the invoice was cancelled"
            invoiceNumber:
              type: string
              example: "001-001-0000123"
            createdAt:
              type: string
              format: date-time
              example: "2026-09-10T14:30:00Z"
            transactionDate:
              type: string
              format: date-time
              example: "2026-09-10T14:30:00Z"
            total:
              type: number
              format: double
              example: 300.00

    InvoiceDetailDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            productId:
              type: integer
              format: int64
              example: 6
            quantity:
              type: integer
              example: 2

    # --- FACTURAS Y DETALLES ESPECIFICOS ---
    SaleInvoiceDetailDTO:
      allOf:
        - $ref: '#/components/schemas/InvoiceDetailDTO'
        - type: object
          properties:
            unitPrice:
              type: number
              format: double
              example: 150.00

    SaleInvoiceDTO:
      allOf:
        - $ref: '#/components/schemas/InvoiceDTO'
        - type: object
          properties:
            clientId:
              type: integer
              format: int64
              example: 4
            details:
              type: array
              items:
                $ref: '#/components/schemas/SaleInvoiceDetailDTO'

    PurchaseInvoiceDetailDTO:
      allOf:
        - $ref: '#/components/schemas/InvoiceDetailDTO'
        - type: object
          properties:
            unitCost:
              type: number
              format: double
              example: 100.00

    PurchaseInvoiceDTO:
      allOf:
        - $ref: '#/components/schemas/InvoiceDTO'
        - type: object
          properties:
            supplierId:
              type: integer
              format: int64
              example: 4
            details:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseInvoiceDetailDTO'

    # --- RESPUESTAS DE ERROR ---
    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: "Product with id 999999 was not found"
        timestamp:
          type: string
          format: date-time

    # --- INVENTARIO ---
    InventoryUpdate:
      type: object
      required:
        - details
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/InventoryUpdateLine'

    InventoryUpdateLine:
      type: object
      required:
        - productId
        - stockDelta
      properties:
        productId:
          type: integer
          format: int64
          example: 10
        stockDelta:
          type: integer
          example: -3
        unitCost:
          type: number
          format: double
          example: 100.20

    # --- ROLES Y USUARIOS ---
    RoleDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            name:
              type: string
              example: "SELLER"
            description:
              type: string
              example: "Employee responsible for sales"

    UserDTO:
      allOf:
        - $ref: '#/components/schemas/BaseDTO'
        - type: object
          properties:
            username:
              type: string
              example: "czyrnia"
            email:
              type: string
              format: email
              example: "achyrnia@gmail.com"
            enabled:
              type: boolean
            lastLogin:
              type: string
              format: date-time
            roles:
              type: array
              items:
                $ref: '#/components/schemas/RoleDTO'

    # --- SOLICITUDES DE USUARIO ---
    CreateUserRequestDTO:
      type: object
      required:
        - username
        - email
        - password
        - roles
      properties:
        username:
          type: string
          example: "czyrnia"
        email:
          type: string
          format: email
          example: "achyrnia@gmail.com"
        password:
          type: string
          format: password
        roles:
          type: array
          minItems: 1
          items:
            type: string
            example: "MANAGER"

    UpdateUserRequestDTO:
      type: object
      properties:
        username:
          type: string
          example: "czyrnia"
        email:
          type: string
          format: email
          example: "achyrnia@gmail.com"
        password:
          type: string
          format: password
        roles:
          type: array
          items:
            type: string
            example: "MANAGER"

    LoginRequestDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "aylen"
        password:
          type: string
          format: password

    LoginResponseDTO:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT access token
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds
          example: 3600

    # --- REPORTES DE VENTAS ---

    ClientMonthlyReportDTO:
      type: object
      required:
        - clientId
        - name
        - document
        - totalSales
        - totalAmount
      properties:
        clientId:
          type: integer
          format: int64
          example: 4
        name:
          type: string
          example: "Juan Pérez"
        document:
          type: string
          example: "1234567-8"
        totalSales:
          type: integer
          format: int64
          example: 18
          description: Number of invoices issued to this client during the month
        totalAmount:
          type: number
          example: 12500000.00
          description: Total amount invoiced to this client during the month

    MonthlySalesSummaryDTO:
      type: object
      required:
        - totalRevenue
        - totalSales
        - averageTicket
        - clientsAttended
      properties:
        totalRevenue:
          type: number
          example: 85400000.00
          description: Total revenue generated during the month
        totalSales:
          type: integer
          format: int64
          example: 142
          description: Total number of invoices issued during the month
        averageTicket:
          type: number
          example: 601408.45
          description: Average invoice amount during the month
        clientsAttended:
          type: integer
          format: int64
          example: 38
          description: Number of distinct clients who made purchases during the month


    # --- EMAIL AUTOMATION SETTINGS ---

    EmailSettingsDTO:
      type: object
      required:
        - senderEmail
        - frequency
        - recipients
        - defaultMessage
        - includeLowStock
        - includeSalesMetrics
      properties:
        senderEmail:
          type: string
          format: email
          example: "notificaciones@teraha.com"
        frequency:
          type: string
          enum:
            - DAILY_AT_CLOSE
            - WEEKLY
            - MONTHLY
          example: DAILY_AT_CLOSE
        recipients:
          type: array
          items:
            type: string
            format: email
          example:
            - "admin@teraha.com"
            - "gerencia@teraha.com"
        defaultMessage:
          type: string
          example: "Hola, adjuntamos el reporte automático de operaciones."
        includeLowStock:
          type: boolean
          example: true
        includeSalesMetrics:
          type: boolean
          example: true

    UpdateEmailSettingsDTO:
      allOf:
        - $ref: '#/components/schemas/EmailSettingsDTO'

    # --- USER APPEARANCE SETTINGS ---

    AppearanceSettingsDTO:
      type: object
      required:
        - accentColor
        - tableDensity
        - sidebarBehavior
      properties:
        accentColor:
          type: string
          enum:
            - EMERALD_NEON
            - MINT_GREEN
            - LIME_GREEN
          example: LIME_GREEN
        tableDensity:
          type: string
          enum:
            - COMPACT
            - NORMAL
            - COMFORTABLE
          example: NORMAL
        sidebarBehavior:
          type: string
          enum:
            - EXPANDED
            - COLLAPSED
          example: EXPANDED

    UpdateAppearanceSettingsDTO:
      allOf:
        - $ref: '#/components/schemas/AppearanceSettingsDTO'

