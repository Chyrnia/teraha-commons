databaseChangeLog:
  - changeSet:
      id: sales-invoice-numbering
      author: czyrnia
      changes:
        - createSequence:
            sequenceName: sale_invoice_sequential_seq
            startValue: 1
            incrementBy: 1
            maxValue: 9999999

        - addColumn:
            tableName: sale_invoices
            columns:
              - column: 
                  name: invoice_sequential
                  type: INTEGER

        - sql:
            sql: |
              UPDATE sale_invoices
              SET invoice_sequential =
                CASE 
                  WHEN invoice_nr ~ '^[0-9]{3}-[0-9]{3}-[0-9]{7}$'
                    THEN split_part(invoice_nr, '-', 3)::INTEGER
                  ELSE nextval('sale_invoice_sequential_seq')
                END
              WHERE invoice_sequential IS NULL;

        - sql:
            sql: |
              SELECT setval(
                'sale_invoice_sequential_seq',
                GREATEST(COALESCE(MAX(invoice_sequential), 0), 1),
                COALESCE(MAX(invoice_sequential), 0) > 0
                )
              FROM sale_invoices;

        - addNotNullConstraint:
            tableName: sale_invoices
            columnName: invoice_sequential
            columnDataType: INTEGER

        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION set_sale_invoice_number()
              RETURNS TRIGGER
              LANGUAGE plpgsql
              AS $$
              BEGIN
                NEW.invoice_sequential := 
                  nextval('sale_invoice_sequential_seq');

                NEW.invoice_nr :=
                  '001-001-' ||
                  LPAD(NEW.invoice_sequential::TEXT, 7, '0');

                RETURN NEW;
              END;
              $$;

        - sql:
            splitStatements: false
            sql: |
              CREATE TRIGGER trg_set_sale_invoice_number
              BEFORE INSERT ON sale_invoices
              FOR EACH ROW
              EXECUTE FUNCTION set_sale_invoice_number();



